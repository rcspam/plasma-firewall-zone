<!-- Session bus for the D-Bus tests. Unlike the stock session.conf it lists no
     service directory, so nothing gets activated on it: Qt asks for the
     desktop portal and the secret service at startup, and those daemons would
     outlive the bus while holding the test output open. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
